{% extends "base.html" %}
{% load static %}
{% block title %}Sign in{% endblock %}
{% block unauthenticated %}
<main class="login-screen flex min-h-screen items-center justify-center px-5 py-12">
  <section class="w-full max-w-md">
    <div class="mb-9 flex items-center gap-3">
      <img class="app-brand-logo login-brand-logo" src="{% static 'img/tripplephase-wordmark.png' %}" alt="Tripple Phase Electricals">
    </div>
    <p class="eyebrow">DOCUMENT WORKSPACE</p>
    <h1 class="mt-3 text-3xl font-bold">Sign in</h1>
    <p class="mt-2 text-sm text-neutral-600">Use your staff account to continue.</p>
    <form class="mt-8 space-y-5" method="post">{% csrf_token %}
      {% if form.errors %}<p class="border-l-2 border-[#e10600] bg-white px-4 py-3 text-sm" role="alert">The username or password was not accepted.</p>{% endif %}
      <div><label class="field-label" for="id_username">Username</label><input class="field-input" id="id_username" name="username" type="text" autocomplete="username" required autofocus></div>
      <div><label class="field-label" for="id_password">Password</label><input class="field-input" id="id_password" name="password" type="password" autocomplete="current-password" required></div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="primary-button w-full" type="submit">Continue <span aria-hidden="true">→</span></button>
    </form>
  </section>
</main>
{% endblock %}
